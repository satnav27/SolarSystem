<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sun">
      <img src="Images/sun.png" alt="sun image" />
    </div>

    <div class="mercury-orbit-path"></div>
    <div class="mercury-orbit-anim">
      <div class="mercury">
        <img src="Images/mercury.png" alt="mercury image" />
      </div>
    </div>

    <div class="venus-orbit-path"></div>
    <div class="venus-orbit-anim">
      <div class="venus">
        <img src="Images/venus.png" alt="" />
      </div>
    </div>

    <div class="earth-orbit-path"></div>
    <div class="earth-orbit-anim">
      <div class="earth">
        <img src="Images/earth.png" alt="" />
      </div>
    </div>

    <div class="mars-orbit-path"></div>
    <div class="mars-orbit-anim">
      <div class="mars">
        <img src="Images/mars.png" alt="" />
      </div>
    </div>

    <div class="jupiter-orbit-path"></div>
    <div class="jupiter-orbit-anim">
      <div class="jupiter">
        <img src="Images/jupiter.png" alt="" />
      </div>
    </div>

    <div class="saturn-orbit-path"></div>
    <div class="saturn-orbit-anim">
      <div class="saturn">
        <img src="Images/saturn.png" alt="" />
      </div>
    </div>

    <div class="uranus-orbit-path"></div>
    <div class="uranus-orbit-anim">
      <div class="uranus">
        <img src="Images/uranus.png" alt="" />
      </div>
    </div>

    <div class="neptune-orbit-path"></div>
    <div class="neptune-orbit-anim">
      <div class="neptune">
        <img src="Images/neptune.png" alt="" />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
